# Copy to Pulumi.<stack>.yaml (e.g. Pulumi.prod.yaml) or let the skill/`pulumi config set`
# populate it. The hcloud:token is the provider credential; everything under
# `config:` (unprefixed keys) is read by src/config.ts.
#
# Secrets (hcloud:token, tailscaleAuthKey) should be set with `--secret` so they
# are stored encrypted, not in plaintext as shown here.
config:
  # --- provider ---
  hcloud:token: YOUR_HETZNER_API_TOKEN   # set with: pulumi config set hcloud:token <tok> --secret

  # --- box basics ---
  name: forge                 # server + resource name prefix
  location: hil               # hil (US-West/Hillsboro), ash (US-East), fsn1/nbg1/hel1 (EU), sin (APAC)
  serverType: cpx21           # 3 vCPU / 4GB. hil offers cpxN1 (cpx11/21/31/…); cpx22/newer is EU-only
  workload: base              # base | coolify | docker | dokploy | opencode | custom
  access: ssh                 # ssh (hardened key-only) | tailscale (mesh + SSH fallback)

  # --- identity / access ---
  adminUser: deploy
  sshPublicKey: "ssh-ed25519 AAAA..."   # pulumi config set sshPublicKey "$(cat ~/.ssh/id_ed25519.pub)"
  sshPrivateKeyPath: "~/.ssh/id_ed25519" # only used by the image-based post-harden step
  sshSource: "0.0.0.0/0"      # CIDR allowed to reach SSH. Tighten to your IP/32 when you can.
  timezone: "UTC"
  # tailscaleAuthKey: tskey-...  # required when access=tailscale (set with --secret)

  # --- extras ---
  extraPorts: ""              # comma-separated TCP ports to open, e.g. "8080,9000"
  swapSizeGb: "0"             # swap file size in GB (helpful on 2-4GB boxes)

  # --- optional peripherals (default off) ---
  volumeSizeGb: "0"           # >0 attaches a formatted, automounted volume
  privateNetwork: "false"
  networkIpRange: "10.10.0.0/16"
  primaryIpv4: "false"        # stable IPv4 that survives server rebuilds
  # primaryIpDatacenter: hil-dc1  # required when primaryIpv4=true. See `hcloud datacenter list`

  # --- custom workload (workload: custom) ---
  # customImage: ""           # an official provider image name, if one exists
  # customInstall: ""         # OR a documented from-scratch install command (bash)
  # customPorts: ""           # comma-separated ingress ports for the workload
  # customDocs: ""            # source URL for the documented procedure

  # --- opencode workload (workload: opencode) --- see profiles/opencode.md
  # opencodeApiKey: sk-...    # required; the user's opencode-go key (set with --secret)
  # opencodePassword: ...     # required; nginx web-login password (set with --secret)
  opencodeUser: opencode      # nginx web-login username
  opencodePort: "4096"        # access port (reached via SSH tunnel)
  opencodeModel: opencode-go/kimi-k3   # default model for a fresh session
